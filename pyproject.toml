[project]
name = "weave"
version = "0.1.0"
description = "Knowledge-graph long-term memory platform for AI agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "lancedb>=0.17",
    "kuzu>=0.7",
    "redis>=5.0",
    "openai>=1.40",
    "httpx>=0.27",
]

[project.scripts]
weave = "weave.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 沙箱环境可能禁写 %TEMP%，tmp_path 统一落在工作区（已被 .gitignore 排除）
addopts = "--basetemp=.pytest_tmp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weave"]
