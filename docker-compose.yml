# ============================================
# Weave - 容器编排
#
# 默认启动：redis + weave 两个服务
#   docker compose up -d --build
#
# full profile：额外启动 web-ui 前端静态站点（nginx，宿主 8080 端口）
#   docker compose --profile full up -d --build
#
# 密钥与行为参数经 .env 注入（env_file）；容器内连接地址由
# environment 强制覆盖（优先级高于 env_file），与本地开发配置解耦。
# ============================================

name: weave

services:
  # ---------- Redis：缓存 + improve/cognify 任务队列 ----------
  redis:
    image: redis:7-alpine
    # appendonly 持久化：避免容器重启后队列中的待处理任务与任务状态丢失
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- Weave 主服务：REST /v1 + MCP /mcp（内嵌 worker 协程） ----------
  weave:
    build: .
    image: weave:latest
    # .env 不存在时不报错（required: false 需要 Compose v2.24+）；
    # 也可完全靠 environment / 外部环境变量注入配置
    env_file:
      - path: .env
        required: false
    environment:
      # 覆盖 .env 中的 127.0.0.1：compose 网络内以服务名互相寻址；
      # 监听地址必须为 0.0.0.0，否则宿主端口映射无法进入容器
      WEAVE_HOST: 0.0.0.0
      REDIS_HOST: redis
    ports:
      # 宿主 8000 -> 容器 8000；如需修改宿主端口改左侧即可
      - "8000:8000"
    volumes:
      # 三库数据（向量库/图库/SQLite）持久化到 named volume
      - weave_data:/app/data
    depends_on:
      redis:
        # 等 Redis 探活通过再启动，避免 worker 启动初期 BRPOP 连不上
        condition: service_healthy
    restart: unless-stopped

  # ---------- 前端静态站点（full profile，可选） ----------
  # 纯 HTML+CSS+JS 无构建工具，nginx 直接托管 data/web-ui 目录；
  # 只读挂载，宿主上修改页面刷新即生效
  web-ui:
    image: nginx:1.27-alpine
    profiles: ["full"]
    volumes:
      - ./data/web-ui:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - weave
    restart: unless-stopped

volumes:
  redis_data:
  weave_data:
